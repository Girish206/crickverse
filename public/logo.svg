<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64">
  <defs>
    <linearGradient id="na-stump" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd23f"/>
      <stop offset="0.45" stop-color="#ff7a1f"/>
      <stop offset="1" stop-color="#d7261e"/>
    </linearGradient>
    <linearGradient id="na-trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb000" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#ff9a00" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ff6a1f" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="na-ball" cx="34%" cy="30%" r="78%">
      <stop offset="0" stop-color="#ff8070"/>
      <stop offset="0.5" stop-color="#d7261e"/>
      <stop offset="1" stop-color="#6e0a10"/>
    </radialGradient>
    <clipPath id="na-ball-clip"><circle cx="44" cy="76" r="17"/></clipPath>
  </defs>
  <g transform="scale(0.5614) translate(-2 -6)">
  <!-- Crease -->
  <path d="M52 112h60" stroke="#8a8f98" stroke-width="3.4" stroke-linecap="round"/>
  <!-- Stumps, the middle one knocked back -->
  <g stroke="#2a0f12" stroke-opacity="0.55" stroke-width="2">
    <rect x="61" y="46" width="11" height="62" rx="5.5" fill="url(#na-stump)"/>
    <rect x="78" y="46" width="11" height="62" rx="5.5" fill="url(#na-stump)" transform="rotate(7 83.5 108)"/>
    <rect x="95" y="46" width="11" height="62" rx="5.5" fill="url(#na-stump)" transform="rotate(3 100.5 108)"/>
  </g>
  <g fill="#fff" opacity="0.4">
    <rect x="63.5" y="50" width="2.6" height="52" rx="1.3"/>
    <rect x="80.5" y="50" width="2.6" height="52" rx="1.3" transform="rotate(7 83.5 108)"/>
    <rect x="97.5" y="50" width="2.6" height="52" rx="1.3" transform="rotate(3 100.5 108)"/>
  </g>
  <!-- Bails flying, with spin arcs -->
  <g fill="#ffc400" stroke="#2a0f12" stroke-opacity="0.55" stroke-width="1.8">
    <rect x="62" y="24" width="20" height="7" rx="3.5" transform="rotate(-30 72 27.5)"/>
    <rect x="90" y="14" width="20" height="7" rx="3.5" transform="rotate(38 100 17.5)"/>
  </g>
  <g fill="none" stroke="#ff8a00" stroke-width="2.6" stroke-linecap="round">
    <path d="M60 36a12 12 0 0 1 4-9"/>
    <path d="M112 26a12 12 0 0 0-3-10"/>
  </g>
  <!-- Impact spark -->
  <g stroke="#ff8a00" stroke-width="3" stroke-linecap="round">
    <path d="M57 58l-2-7M63 61l4-6M58 95l-1 7"/>
  </g>
  <!-- Comet trail -->
  <path d="M6 70C20 64 32 60 44 59L44 93C32 92 20 88 6 82Z" fill="url(#na-trail)"/>
  <!-- Ball -->
  <circle cx="44" cy="76" r="17" fill="url(#na-ball)" stroke="#2a0f12" stroke-opacity="0.6" stroke-width="2"/>
  <g clip-path="url(#na-ball-clip)" transform="rotate(30 44 76)" fill="none" stroke="#fff1e0" stroke-linecap="round">
    <path d="M40.8 57v38M47.2 57v38" stroke-width="1.8"/>
    <path d="M44 58v36" stroke-width="3.4" stroke-dasharray="1.2 2.6"/>
  </g>
  <ellipse cx="37.5" cy="68.5" rx="5.5" ry="3" fill="#fff" opacity="0.38" transform="rotate(-35 37.5 68.5)"/>
  </g>
  <text x="74" y="33" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="27" font-weight="800" font-style="italic" letter-spacing="0.5">
    <tspan fill="#e8501f">NAMMA </tspan><tspan fill="#d7261e">AAATA</tspan>
  </text>
  <text x="75" y="56" font-family="'Baloo Tamma 2', 'Noto Sans Kannada', 'Nirmala UI', 'Tunga', sans-serif" font-size="18" font-weight="700" fill="#8a8f98">ನಮ್ಮ ಆಟ</text>
</svg>
